<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>운동 기록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== 달력 화면 ========== -->
  <div class="app" id="calendarView">
    <header class="date-bar">
      <div class="date-bar__top">
        <button class="icon-btn" id="prevMonth" type="button" aria-label="이전 달">‹</button>
        <h1 class="date-bar__title" id="monthLabel"></h1>
        <button class="icon-btn" id="nextMonth" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="copy-bar">
        <p class="copy-bar__guide" id="copyGuide" aria-live="polite"></p>
        <button class="copy-toggle" id="copyToggle" type="button" aria-pressed="false">
          <span class="copy-toggle__track" aria-hidden="true"><span class="copy-toggle__thumb"></span></span>
          기록 복사
        </button>
      </div>
    </header>

    <main class="content content--calendar">
      <section class="plan" aria-labelledby="planTitle">
        <h2 class="plan__title" id="planTitle">오늘 뭐 할까</h2>
        <p class="plan__desc">부위별로 마지막으로 한 날 · 오래된 순</p>
        <ol class="plan__list" id="planList"></ol>
      </section>

      <div class="calendar" id="calendar">
        <ol class="calendar__weekdays" aria-hidden="true">
          <li>일</li><li>월</li><li>화</li><li>수</li><li>목</li><li>금</li><li>토</li>
        </ol>
        <ol class="calendar__grid" id="calendarGrid"></ol>
      </div>
      <button class="ghost-btn today-btn" id="todayBtn" type="button">오늘 기록하기</button>
    </main>
  </div>

  <!-- ========== 하루 기록 화면 ========== -->
  <div class="app" id="dayView" hidden>
    <header class="date-bar">
      <div class="date-bar__top date-bar__top--day">
        <button class="back-btn" id="backBtn" type="button" aria-label="달력으로 돌아가기">
          <span aria-hidden="true">‹</span> 달력
        </button>
        <div class="day-nav">
          <button class="icon-btn" id="prevDay" type="button" aria-label="이전 날">‹</button>
          <h1 class="date-bar__title" id="dayTitle"></h1>
          <button class="icon-btn" id="nextDay" type="button" aria-label="다음 날">›</button>
        </div>
        <span class="back-btn back-btn--spacer" aria-hidden="true"></span>
      </div>
    </header>

    <main class="content">
      <div class="summary">
        <div>
          <p class="summary__label" id="dayLabel">오늘의 운동</p>
          <p class="summary__value"><strong id="exerciseCount">0</strong>종목 · <strong id="setCount">0</strong>세트</p>
        </div>
        <div class="summary__volume">
          <p class="summary__label">총 볼륨</p>
          <p class="summary__value"><strong id="totalVolume">0</strong>kg</p>
        </div>
      </div>

      <ul class="workout-list" id="workoutList"></ul>

      <p class="empty" id="emptyState" hidden>아직 기록한 운동이 없어요.<br>아래 버튼으로 운동을 추가해 보세요.</p>
    </main>

    <!-- 하단: 운동 추가 -->
    <footer class="bottom-bar">
      <button class="add-btn" id="addBtn" type="button">
        <span class="add-btn__plus" aria-hidden="true">+</span>
        운동 추가
      </button>
    </footer>
  </div>

  <!-- 운동 추가/수정 시트 -->
  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <form class="sheet__form" id="exerciseForm" novalidate>
      <div class="sheet__head">
        <div>
          <h2 class="sheet__title" id="sheetTitle">운동 추가</h2>
          <p class="sheet__date" id="sheetDate"></p>
        </div>
        <button class="icon-btn" type="button" id="closeSheet" aria-label="닫기">×</button>
      </div>

      <div class="sheet__body">
        <div class="field">
          <label class="field__label" for="nameInput">종목</label>
          <input class="input" id="nameInput" type="text" placeholder="예: 벤치프레스" autocomplete="off" enterkeyhint="next">
          <div class="suggest" id="suggestList" aria-label="최근 종목"></div>
          <div class="history" id="historyBox" hidden></div>
        </div>

        <div class="field">
          <span class="field__label">부위 <span class="field__hint">(선택)</span></span>
          <div class="chips" id="partChips"></div>
        </div>

        <div class="field">
          <div class="set-head">
            <span class="field__label">세트</span>
            <span class="set-head__col">횟수</span>
            <span class="set-head__col">무게(kg)</span>
            <span class="set-head__gap"></span>
          </div>
          <ol class="set-rows" id="setRows"></ol>
          <button class="ghost-btn" type="button" id="addSetBtn">+ 세트 추가</button>
        </div>

        <p class="form-error" id="formError" role="alert"></p>
      </div>

      <div class="sheet__foot">
        <button class="danger-btn" type="button" id="deleteBtn">삭제</button>
        <button class="add-btn" type="submit" id="saveBtn">저장</button>
      </div>
    </form>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast__text" id="toastText"></span>
    <button class="toast__action" id="toastAction" type="button" hidden></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
